name: CI

# 分支与仓库实际一致：默认分支 main（v1.1 冻结），重写分支 rewrite/v2。
on:
  push:
    branches: [main, rewrite/v2]
  pull_request:
    branches: [main, rewrite/v2]

permissions:
  contents: read

# 同一分支只保留最新一次运行，旧的自动取消，省 runner 时间也避免旧结果误导。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 门禁（windows-latest / Python 3.13）
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # 与本地门禁一致：cp936 控制台下 pytest/pdb 会 UnicodeDecodeError。
      PYTHONUTF8: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: 安装依赖
        # T0.2 之后依赖放在 [dependency-groups]，--all-extras 兜底 optional-dependencies。
        run: uv sync --all-groups --all-extras

      - name: 运行门禁
        # run_tests.py 是唯一门禁入口：ruff → mypy → tach → bandit → pytest-cov。
        run: uv run python run_tests.py

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            .coverage
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7
