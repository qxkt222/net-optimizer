# -*- coding: utf-8 -*-
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "net-optimizer"
version = "2.0.0.dev0"
description = "Windows 网络诊断与一键优化工具"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "rich>=15.0",
    "typer>=0.27",
    "httpx>=0.28",
]

# 开发期依赖（PEP 735 dependency-groups，uv 原生支持；不会装给终端用户）
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "mypy>=2.1",
    "ruff>=0.15",
    "tach>=0.35",
    "bandit>=1.9",
    "pyinstaller>=6.21",
]

[project.scripts]
netopt = "netopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["netopt"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".git", "__pycache__", ".ruff_cache", ".pytest_cache", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",
]
ignore = [
    "E501",     # 行宽交给 formatter
    "UP009",    # 保留 `# -*- coding: utf-8 -*-`：与项目既有文件保持一致
    "RUF001",   # 中文字符串里出现全角标点很正常
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]     # 测试里 assert False 是合法写法

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["netopt"]
python_version = "3.11"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["netopt"]

[tool.coverage.report]
show_missing = true
