[project]
name = "net-optimizer"
version = "1.1"
description = "Windows 网络诊断与一键优化工具"
requires-python = ">=3.10"
dependencies = []          # 有意保持零第三方依赖：纯标准库

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".git", "__pycache__", ".ruff_cache", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",
]
ignore = [
    "E501",     # 行宽交给 formatter
    "UP009",    # 保留 `# -*- coding: utf-8 -*-`：与项目既有文件保持一致
    "RUF001",   # 中文字符串里出现全角标点很正常
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]     # 测试里 assert False 是合法写法

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
